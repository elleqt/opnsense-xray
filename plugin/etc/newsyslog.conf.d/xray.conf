# newsyslog rotation config for os-xray plugin
# BUG-11 FIX: без ротации лог /var/log/xray-core.log (добавлен в BUG-7) растёт бесконечно.
#
# Формат полей (man newsyslog.conf):
#   logfile_name  [owner:group]  mode  count  size  when  [flags]  [/pid_file]  [sig_num]
#
# count=3  — хранить 3 архива (xray-core.log.0, .1, .2)
# size=600  — ротировать при размере > 600 KB (600*1024 байт = 614400 B)
# when=*    — не ротировать по расписанию, только по размеру
# flags=JGR — J: bzip2-сжатие архива; G: имя файла — glob-шаблон;
#             R: после ротации выполнить команду из поля pid_file вместо сигнала
#
# Лог держит открытым daemon(8) (proc_start: -H -o), поэтому после ротации ему
# нужен SIGHUP, иначе он пишет дальше в переименованный и удалённый файл.
# Демонов несколько (xray-core и tun2socks на каждый инстанс), а у newsyslog
# одно поле pid_file на строку, поэтому SIGHUP рассылает xray-log-reopen.sh.

/var/log/xray-core.log          644  3  600  *  JGR  /usr/local/opnsense/scripts/Xray/xray-log-reopen.sh
/var/log/xray-core-*.log        644  3  600  *  JGR  /usr/local/opnsense/scripts/Xray/xray-log-reopen.sh
